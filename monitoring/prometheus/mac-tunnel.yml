# Select with PROMETHEUS_CONFIG=./prometheus/mac-tunnel.yml in monitoring/.env.
# The Mac HTTP service is available on the Docker host via a reverse SSH tunnel.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: alpha-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18080"]
