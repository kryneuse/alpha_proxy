name: Delivery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images (${{ matrix.name }})
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
            image: ghcr.io/kryneuse/alpha-proxy-api
            cache-scope: delivery-api
          - name: ml
            context: ./ml-service
            file: ./ml-service/Dockerfile
            image: ghcr.io/kryneuse/alpha-proxy-ml
            cache-scope: delivery-ml
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            ${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/kryneuse/alpha_proxy
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  summary:
    name: Delivery summary
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        env:
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Delivery complete

          Delivered SHA: \`$SHA\`

          Immutable images:
          - \`ghcr.io/kryneuse/alpha-proxy-api:$SHA\`
          - \`ghcr.io/kryneuse/alpha-proxy-ml:$SHA\`

          To deploy this version, run the **Deploy production** workflow with SHA \`$SHA\`.
          EOF
