syntax = "proto3";

package alpha_proxy.ml.v1;

option go_package = "github.com/kryneuse/alpha_proxy/gen/ml/v1;mlv1";

// PIIDetector — сервис обнаружения персональных данных в тексте.
// Go backend отправляет один batch с несколькими независимыми chunks,
// ML возвращает найденные сущности. ML не создаёт токены и не знает
// глобальные offsets — финальные токены, глобальные offsets, дедупликацию
// и merge выполняет Go backend.
service PIIDetector {
  // DetectBatch — unary метод обработки одного batch с несколькими
  // независимыми chunks текста.
  //
  // Общие ошибки всего RPC (не отдельных chunks):
  // INVALID_ARGUMENT — сломана структура всего batch (например, пустой
  // batch_id или пустой список chunks).
  // RESOURCE_EXHAUSTED — очередь ML переполнена. В этом случае ML не
  // возвращает частичный обычный ответ, а завершает
  // весь RPC ошибкой.
  // UNAVAILABLE — ML временно недоступен.
  // DEADLINE_EXCEEDED — превышен deadline запроса.
  //
  // Ошибки отдельных chunks передаются через ChunkErrorCode внутри
  // ChunkResult, а не через статус RPC. Backend передаёт deadline, и ML
  // должно прекращать работу при отмене context. gRPC не возвращает HTTP 429
  // — этим занимается внешний HTTP слой.
  rpc DetectBatch(DetectBatchRequest) returns (DetectBatchResponse);
}

// OffsetUnit — единица измерения координат сущностей.
enum OffsetUnit {
  // OFFSET_UNIT_UNSPECIFIED — значение по умолчанию. Используется, чтобы
  // отсутствующее поле нельзя было принять за правильное.
  OFFSET_UNIT_UNSPECIFIED = 0;
  // OFFSET_UNIT_UNICODE_CODE_POINTS — координаты считаются в Unicode code
  // points относительно начала текста конкретного chunk.
  OFFSET_UNIT_UNICODE_CODE_POINTS = 1;
}

// EntityType — тип персональных данных, найденных в тексте.
enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_FULL_NAME = 1;
  ENTITY_TYPE_FIRST_NAME = 2;
  ENTITY_TYPE_LAST_NAME = 3;
  ENTITY_TYPE_PATRONYMIC = 4;
  ENTITY_TYPE_ADDRESS = 5;
  ENTITY_TYPE_CITY = 6;
  ENTITY_TYPE_STREET = 7;
  ENTITY_TYPE_HOUSE = 8;
  ENTITY_TYPE_APARTMENT = 9;
  ENTITY_TYPE_PLACE_OF_BIRTH = 10;
  ENTITY_TYPE_CITIZENSHIP = 11;
  ENTITY_TYPE_PASSPORT_ISSUER = 12;
  ENTITY_TYPE_CARDHOLDER_NAME = 13;
  ENTITY_TYPE_EMAIL = 14;
  ENTITY_TYPE_PHONE = 15;
  ENTITY_TYPE_INN = 16;
  ENTITY_TYPE_CARD = 17;
  ENTITY_TYPE_PASSPORT = 18;
  ENTITY_TYPE_DEPARTMENT_CODE = 19;
  ENTITY_TYPE_DATE = 20;
  ENTITY_TYPE_DRIVER_LICENSE = 21;
  ENTITY_TYPE_CVV = 22;
  ENTITY_TYPE_PIN = 23;
  ENTITY_TYPE_POSTAL_CODE = 24;
}

// ChunkErrorCode — машинный код ошибки для отдельного chunk.
// Содержит только короткий код без текста, payload и персональных данных.
enum ChunkErrorCode {
  CHUNK_ERROR_CODE_UNSPECIFIED = 0;
  // NONE — ошибки нет, результат успешно обработан.
  CHUNK_ERROR_CODE_NONE = 1;
  // INVALID_TEXT — переданный текст невалиден.
  CHUNK_ERROR_CODE_INVALID_TEXT = 2;
  // TOO_LARGE — текст chunk превышает допустимый размер.
  CHUNK_ERROR_CODE_TOO_LARGE = 3;
  // MODEL_ERROR — внутренняя ошибка модели при обработке chunk.
  CHUNK_ERROR_CODE_MODEL_ERROR = 4;
}

// DetectBatchRequest — один запрос к ML-сервису с несколькими независимыми
// chunks текста. Один вызов обрабатывает все items за раз, что позволяет
// ML батчить вычисления и снижать накладные расходы на сетевые вызовы.
//
// Правила запроса:
// - batch_id должен быть непустым.
// - chunks должен содержать хотя бы один элемент.
// - chunk_id должен быть непустым и уникальным внутри batch.
// - text должен быть валидным UTF-8.
// - Размер chunk и overlap настраиваются в backend. Значения по умолчанию
// сейчас: target 350 Unicode code points, max 350, overlap до 50.
// - Backend сначала старается разрезать текст по границе абзаца или
// предложения. Если разрез прошёл по безопасной границе, следующий chunk
// начинается без overlap.
// - Overlap используется только когда длинное предложение или другой
// цельный фрагмент пришлось разрезать внутри.
// - Каждый chunk всегда является непрерывным фрагментом только одного
// исходного payload.
// - ML обрабатывает каждый chunk независимо, не должно пытаться соединять
// chunks и не должно учитывать overlap самостоятельно.
// - Backend хранит временную позицию каждого chunk, переводит локальные
// offsets в глобальные и удаляет дубли.
// - Количество chunks в batch ограничивается настройками batch_max_items,
// batch_max_chars и batch_max_wait. Конкретные значения лимитов батча
// согласуются с ML отдельно и не фиксируются в proto.
message DetectBatchRequest {
  // batch_id связывает этот запрос с ответом DetectBatchResponse.
  string batch_id = 1;

  // offset_unit — единица измерения координат сущностей в ответе.
  OffsetUnit offset_unit = 2;

  // chunks — список независимых chunks текста для обработки.
  // В одном batch могут находиться chunks разных payload, но каждый chunk
  // остаётся отдельным элементом. Тексты разных chunks нельзя склеивать
  // между собой.
  repeated Chunk chunks = 3;
}

// Chunk — один независимый фрагмент текста внутри batch.
message Chunk {
  // chunk_id связывает этот chunk с результатом в DetectBatchResponse.
  // Backend по нему сопоставляет найденные сущности с временными данными
  // chunk (например, с его глобальными byte offsets внутри исходного payload).
  string chunk_id = 1;

  // text — текст только одного chunk. payload_id и данные session в ML
  // не передаются. ML не знает, какому payload принадлежит chunk, и не
  // должен нормализовать или изменять переданный текст.
  string text = 2;
}

// DetectBatchResponse — ответ ML-сервиса на DetectBatchRequest.
//
// Правила ответа:
// - batch_id должен точно совпадать с batch_id из запроса.
// - model_version должен быть непустым.
// - offset_unit должен совпадать с offset_unit из запроса.
// - На каждый chunk должен быть ровно один ChunkResult без пропусков,
// дублей и лишних chunk_id.
// - Если error_code равен NONE, то entities можно обрабатывать.
// - Если error_code не NONE, то entities должны быть пустыми.
// - У каждой entity тип не UNSPECIFIED, confidence от 0 до 1 и координаты
// 0 <= start < end <= длина chunk в Unicode code points.
message DetectBatchResponse {
  // batch_id повторяет batch_id из запроса, чтобы backend мог сопоставить
  // ответ с конкретным запросом.
  string batch_id = 1;

  // model_version — версия модели, обработавшей запрос. Нужна для проверки
  // согласованности и инвалидации кэша при обновлении модели.
  string model_version = 2;

  // offset_unit повторяет единицу измерения координат из запроса.
  OffsetUnit offset_unit = 3;

  // results — результаты по каждому chunk из запроса. Порядок результатов
  // может отличаться от порядка chunks в запросе, поэтому backend связывает
  // их по chunk_id. Для каждого chunk должен прийти ровно один результат.
  repeated ChunkResult results = 4;
}

// ChunkResult — результат обработки одного chunk.
message ChunkResult {
  // chunk_id повторяет chunk_id из Chunk, чтобы backend мог сопоставить
  // результат с нужным chunk.
  string chunk_id = 1;

  // entities — найденные в этом chunk сущности. Координаты start и end
  // считаются в Unicode code points относительно начала текста этого chunk.
  repeated Entity entities = 2;

  // error_code — машинный код ошибки для этого chunk, если он не смог быть
  // обработан. Один неудачный chunk не должен удалять успешные результаты
  // остальных chunks — они приходят в том же ответе.
  ChunkErrorCode error_code = 3;
}

// Entity — одна найденная персональная сущность внутри chunk.
message Entity {
  // type — тип персональных данных.
  EntityType type = 1;

  // start — начало сущности, включительно, в Unicode code points
  // относительно начала текста chunk. Считается с нуля.
  int32 start = 2;

  // end — конец сущности, не включительно, в Unicode code points
  // относительно начала текста chunk. Считается с нуля.
  int32 end = 3;

  // confidence — уверенность модели в найденной сущности от 0 до 1.
  float confidence = 4;
}